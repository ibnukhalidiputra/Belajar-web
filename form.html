<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Form>
        <label for="Username">Username:</label><br>
        <input type="text" name="Username">
        <br><br>
        <label for="email">Email:</label><br>
        <input type="email" name="email" required>
        <br><br>
        <label for="password">Password:</label><br>
        <input type="password" name="password" required>
        <br><br>
        <label for="Alamat">Alamat:</label><br>
        <textarea id="Alamat" name="Alamat" rows="4" cols="50"></textarea>
        <br><br>
        <label for="Jenis Kelamin">Jenis Kelamin:</label><br>
        <input type="radio" name="Jenis Kelamin" value="Laki-Laki">Laki-Laki
        <input type="radio" name="Jenis Kelamin" value="Perempuan">Perempuan
        <br><br>
        <label for="Hobby">Hobby:</label><br>
        <input type="checkbox" name="Hobby" value="Menggambar">Menggambar
        <input type="checkbox" name="Hobby" value="Membaca">Membaca
        <input type="checkbox" name="Hobby" value="Menulis">Menulis
        <br><br>
        <label for="Perkerjaan">Pekerjaan:</label><br>
        <select name="Perkerjaan" id="Perkerjaan"><br>
            <option value="Pelajar">Pelajar</option>
            <option value="Mahasiswa">Mahasiswa</option>
            <option value="PNS">PNS</option>
            <option value="Swasta">Swasta</option>
        </select>
        <br>

        <input type="submit" value="Kirim">
        <button type="reset">Reset</button>
    </Form>
    </form>
</body>
</html>
